name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  linkage-audit-tools:
    name: linkageAuditExpected
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test campaign booklet linkage audit tools
        run: python -m unittest discover -s tests -p "test_campaign_booklet_enriched_audit.py"

  rcmdcheck:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: macOS-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'

  testExpected:
    name: testExpected
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [rcmdcheck, linkage-audit-tools]

    steps:
      - name: Require successful R-CMD-check matrix
        shell: bash
        run: |
          set -euo pipefail
          result='${{ needs.rcmdcheck.result }}'
          linkage_result='${{ needs.linkage-audit-tools.result }}'
          echo "R-CMD-check matrix result: ${result}"
          echo "Linkage audit tools result: ${linkage_result}"
          [ "${result}" = "success" ]
          [ "${linkage_result}" = "success" ]

  security:
    name: securityExpected
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Scan tracked files for obvious secrets
        shell: bash
        run: |
          set -euo pipefail
          pattern='(gh[pousr]_[A-Za-z0-9]{20,255}|github_pat_[A-Za-z0-9_]{20,255}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN (RSA|OPENSSH|EC|DSA|PGP) PRIVATE KEY-----)'
          if git grep -nEI -- "${pattern}" -- . ':(exclude)docs/deps'; then
            echo "Potential secret-like content detected."
            exit 1
          fi

          echo "No obvious secret patterns detected."
