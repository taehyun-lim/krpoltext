name: pkgdown

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    permissions:
      contents: write

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::jsonlite, any::devtools, any::roxygen2, local::.
          needs: website

      - name: Generate roxygen docs
        run: roxygen2::roxygenise()
        shell: Rscript {0}

      - name: Build pkgdown site
        run: |
          pkgdown::build_site_github_pages(
            new_process = FALSE,
            install = FALSE
          )
        shell: Rscript {0}

      - name: Generate Static API files into docs/data/
        run: Rscript tools/build_api.R docs/data

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs
          clean: true

      - name: Verify public JSON endpoints
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://taehyun-lim.github.io/krpoltext/data/index.json"
            "https://taehyun-lim.github.io/krpoltext/data/metadata.json"
          )

          for url in "${urls[@]}"; do
            ok=0
            for attempt in {1..24}; do
              code="$(curl -L -s -o /dev/null -w "%{http_code}" "$url")"
              if [ "$code" = "200" ]; then
                ok=1
                echo "Verified $url"
                break
              fi
              echo "Attempt $attempt for $url returned $code; retrying..."
              sleep 10
            done

            if [ "$ok" -ne 1 ]; then
              echo "Endpoint did not become available: $url"
              exit 1
            fi
          done
