name: pkgdown

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    permissions:
      contents: write

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::jsonlite, any::devtools, any::roxygen2, local::.
          needs: website

      - name: Generate roxygen docs
        run: roxygen2::roxygenise()
        shell: Rscript {0}

      - name: Build pkgdown site
        run: |
          pkgdown::build_site_github_pages(
            new_process = FALSE,
            install = FALSE
          )
        shell: Rscript {0}

      - name: Generate Static API files into docs/data/
        run: Rscript tools/build_api.R docs/data

      - name: Normalize bilingual landing pages
        run: Rscript tools/postprocess_pkgdown_site.R docs

      - name: Validate generated Static API files
        shell: Rscript {0}
        run: |
          paths <- c(
            "docs/data/index.json",
            "docs/data/metadata.json",
            "docs/data/schema/campaign_booklet.json",
            "docs/data/schema/campaign_booklet_enriched.json",
            "docs/data/schema/party_statements.json"
          )

          missing <- paths[!file.exists(paths)]
          if (length(missing) > 0) {
            stop("Missing generated API files: ", paste(missing, collapse = ", "))
          }

          invisible(lapply(paths, jsonlite::read_json, simplifyVector = FALSE))

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs
          clean: true
