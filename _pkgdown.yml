url: https://taehyun-lim.github.io/krpoltext

home:
  strip_header: false
  sidebar:
    structure: [links, license, citation, authors, dev, toc]

redirects:
  - [README.html, index.html]

template:
  bootstrap: 5
  bslib:
    primary: "#0d6efd"

navbar:
  structure:
    left: [intro, reference, articles, release, data-api]
    right: [search, github]
  components:
    release:
      text: Release
      menu:
        - text: NEWS
          href: https://github.com/taehyun-lim/krpoltext/blob/main/NEWS.md
        - text: GitHub Releases
          href: https://github.com/taehyun-lim/krpoltext/releases
    data-api:
      text: Data API
      href: data-api.html

articles:
  - title: Getting Started
    navbar: Getting Started
    contents:
      - quick-start
  - title: Advanced Usage
    navbar: Advanced
    contents:
      - replication-pipeline

reference:
  - title: Load Data
    desc: Download and load corpora from OSF in CSV or Parquet formats
    contents:
      - load_campaign_booklet
      - load_party_statements
      - download_data
  - title: Explore and Filter
    desc: Inspect metadata, schemas, and document filters
    contents:
      - metadata
      - schema
      - get_docs
      - filter_docs
      - select_vars
  - title: Integration
    desc: Convert to other formats
    contents:
      - as_quanteda_corpus
  - title: Cache Management
    contents:
      - clear_cache

